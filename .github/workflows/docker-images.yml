# Builds the N-Health server images. On main they are published to GitHub's registry
# (ghcr.io/abubkrrr/nhealth-api and nhealth-web) so the server only downloads them
# with `nhealth-update` - nothing is compiled on the server. Pull requests build only.
name: Docker images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/landing/**'
      - 'apps/admin-web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'deploy/docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:
    inputs:
      api_origin:
        description: Public API address built into the web apps
        default: https://api.nhealth.com.ng

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub's registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nhealth-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            API_ORIGIN=${{ inputs.api_origin || 'https://api.nhealth.com.ng' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test (API image starts and answers /health)
        if: matrix.image == 'api'
        run: |
          docker network create t
          docker run -d --name pg --network t -e POSTGRES_USER=nhealth -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=nhealth postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U nhealth && break; sleep 2; done
          docker buildx build --load -t api:smoke -f deploy/docker/api.Dockerfile --cache-from type=gha,scope=api .
          docker run -d --name api --network t -e DATABASE_URL=postgresql://nhealth:pw@pg:5432/nhealth -e JWT_SECRET=smoke-test-secret-smoke-test-secret -e NODE_ENV=production -e CORS_ORIGIN=https://www.nhealth.com.ng api:smoke
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break; sleep 3; done
          docker logs --tail 40 api
          [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ]
