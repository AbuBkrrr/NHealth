name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '20'

jobs:
  # ==================== FRONTEND BUILD & TEST ====================
  frontend-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd admin-web
          npm install

      - name: Run TypeScript check
        run: |
          cd admin-web
          npm run build

      - name: Run unit tests
        run: |
          cd admin-web
          npm run test
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-test-results
          path: admin-web/coverage/

  # ==================== BACKEND BUILD & TEST ====================
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nhealth
          POSTGRES_PASSWORD: nhealth
          POSTGRES_DB: nhealth
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://nhealth:nhealth@localhost:5432/nhealth
        run: |
          cd backend
          npm run migrate

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://nhealth:nhealth@localhost:5432/nhealth
          JWT_SECRET: test-secret-key
        run: |
          cd backend
          npm run test
        continue-on-error: true

      - name: Build backend
        run: |
          cd backend
          npm run build

  # ==================== CODE QUALITY CHECKS ====================
  code-quality:
    name: Code Quality - Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ESLint
        run: npm install eslint --save-dev

      - name: Run ESLint
        run: |
          npx eslint admin-web/src/**/*.tsx --max-warnings 0
        continue-on-error: true

  # ==================== SECURITY SCAN ====================
  security:
    name: Security - Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run npm audit
        run: |
          cd admin-web
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run backend security audit
        run: |
          cd backend
          npm audit --audit-level=moderate
        continue-on-error: true

  # ==================== BUILD & PUSH DOCKER IMAGE ====================
  build-docker:
    name: Docker - Build & Push
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./admin-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== DEPLOY TO STAGING ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment script here
          # Example: ssh user@staging-server "cd /app && docker-compose pull && docker-compose up -d"

  # ==================== DEPLOY TO PRODUCTION ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Vercel (Frontend)
        uses: vercel/action@master
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./admin-web

      - name: Deploy to production server (Backend)
        run: |
          echo "Deploying backend to production..."
          # Add your production deployment script
          # Example: ssh user@prod-server "cd /app && docker pull ... && docker-compose up -d"

  # ==================== NOTIFY ====================
  notify:
    name: Notify - Send Status
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend-test, backend-test, code-quality]

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "N-Health CI/CD Pipeline",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*N-Health Build Status*\n${{ job.status }}"
                  }
                }
              ]
            }
        continue-on-error: true
