name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

env:
  HUSKY: 0
  CI: true

jobs:
  backend:
    name: Backend - typecheck, migrate, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nh
          POSTGRES_PASSWORD: nh
          POSTGRES_DB: nhealth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nh:nh@localhost:5432/nhealth_test
      TEST_DATABASE_URL: postgresql://nh:nh@localhost:5432/nhealth_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate & migrate
        working-directory: apps/backend
        run: npx prisma generate && npx prisma migrate deploy
      - name: Schema matches migrations (no drift)
        working-directory: apps/backend
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Typecheck
        run: pnpm --filter @nhealth/backend typecheck
      - name: API tests
        run: pnpm --filter @nhealth/backend test
      - name: Build
        run: pnpm --filter @nhealth/backend build

  web:
    name: Web app & admin console - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app (apps/landing)
        run: pnpm --filter @nhealth/landing build
      - name: Build admin console
        run: pnpm --filter @nhealth/admin-web build
