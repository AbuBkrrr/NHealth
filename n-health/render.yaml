services:
  - type: web
    name: n-health-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: bash -c "cat backend/tsconfig.json && npm install && npm run build && npx prisma migrate deploy"
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: n-health-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: PUBLIC_URL
        sync: false

  - type: web
    name: n-health-admin-web
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://n-health-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: n-health-db
    plan: free
    databaseName: nhealth
    user: nhealth
