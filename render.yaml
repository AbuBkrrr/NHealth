services:
  - type: web
    name: n-health-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: n-health-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*" # tighten to your admin-web/mobile origins once you have them
      - key: PUBLIC_URL
        sync: false # set this to this service's own public URL after first deploy (see README)

  - type: web
    name: n-health-admin-web
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to https://<n-health-backend>.onrender.com/api after the backend deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: n-health-db
    plan: free
    databaseName: nhealth
    user: nhealth
