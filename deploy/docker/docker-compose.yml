# N-Health on a Docker server, next to your other apps.
# Lives in /opt/nhealth on the server (set up by deploy/docker/setup.sh).
#   docker compose ps | logs -f api | pull | up -d
#
# - Nothing is published on the server's ports: your existing proxy (Caddy, Traefik,
#   Nginx Proxy Manager...) reaches nhealth-web and nhealth-api over its Docker network
#   (PROXY_NETWORK) and handles HTTPS.
# - The database sits on a private network only the API can reach.
# - Memory limits keep N-Health from squeezing your other containers.
name: nhealth

services:
  db:
    image: postgres:17-alpine
    container_name: nhealth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nhealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nhealth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhealth -d nhealth"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    mem_limit: 320m
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ${API_IMAGE:-ghcr.io/abubkrrr/nhealth-api:latest}
    container_name: nhealth-api
    restart: unless-stopped
    env_file: backend.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://nhealth:${POSTGRES_PASSWORD}@db:5432/nhealth
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/apps/backend/uploads
    networks: [internal, proxy]
    mem_limit: 640m
    logging: *logs

  web:
    image: ${WEB_IMAGE:-ghcr.io/abubkrrr/nhealth-web:latest}
    container_name: nhealth-web
    restart: unless-stopped
    networks: [proxy]
    mem_limit: 64m
    logging: *logs

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env (your proxy container's network)}

volumes:
  pgdata:
  uploads:
