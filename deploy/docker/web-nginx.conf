# Inside the nhealth-web container. Your proxy (Caddy etc.) handles HTTPS and forwards here.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

# Admin console: admin.<domain>
server {
    listen 80;
    server_name ~^admin\.;
    root /srv/admin;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
}

# Web app (PWA): www.<domain> and anything else
server {
    listen 80 default_server;
    server_name _;
    root /srv/web;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
}
