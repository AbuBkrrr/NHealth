# N-Health - Nginx sites. Generated by deploy/vps/install.sh (__DOMAIN__).
# HTTPS is added by certbot, which edits this file in place.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Apex -> www
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://www.__DOMAIN__$request_uri;
}

# Web app (PWA)
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    root __APP_DIR__/apps/landing/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
}

# Admin console
server {
    listen 80;
    listen [::]:80;
    server_name admin.__DOMAIN__;
    root __APP_DIR__/apps/admin-web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

# API + realtime (Socket.io)
server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__;

    client_max_body_size 30m;   # chat videos & documents (the API enforces per-type limits)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
