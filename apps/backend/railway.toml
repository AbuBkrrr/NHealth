[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @nhealth/backend build"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
startCommand = "pnpm --filter @nhealth/backend start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
