[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @nhealth/admin-web build"

[deploy]
startCommand = "pnpm --filter @nhealth/admin-web start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
